server {
    listen 80;
    server_name _;

    # Reverse proxy: tudo que começa com /api/ vai pro BFF via DNS interno do Docker.
    # Browser não precisa saber a porta do BFF — usa URL relativa.
    # Bônus: mesma origem → sem CORS.
    location /api/ {
        proxy_pass http://bff:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o resto: serve estático do disco
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
